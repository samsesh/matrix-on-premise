version: '3'
services:
  coturn:
    image: instrumentisto/coturn:latest
    restart: unless-stopped
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf
    ports:
      - "49160-49200:49160-49200/udp"
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
    healthcheck:
      test: ["CMD", "nc", "-zu", "127.0.0.1", "3478"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - matrix-network

  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    volumes:
      - ./synapse:/data
    ports:
      - "8008:8008"
      - "8448:8448"
    environment:
      - TZ=${TZ:-UTC}
      - UID=${UID:-991}
      - GID=${GID:-991}
      - SYNAPSE_SERVER_NAME=${SYNAPSE_SERVER_NAME:-localhost}
      - SYNAPSE_REPORT_STATS=${SYNAPSE_REPORT_STATS:-yes}
      - SYNAPSE_VOIP_TURN_URIS=["turn:${TURN_SERVER:-localhost}:3478?transport=udp","turn:${TURN_SERVER:-localhost}:3478?transport=tcp","turns:${TURN_SERVER:-localhost}:5349?transport=udp","turns:${TURN_SERVER:-localhost}:5349?transport=tcp"]
      - SYNAPSE_VOIP_TURN_SHARED_SECRET=${TURN_SHARED_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      coturn:
        condition: service_started
    networks:
      - matrix-network

  element:
    image: vectorim/element-web:latest
    restart: unless-stopped
    volumes:
      - ./element-config.json:/app/config.json
      - ./element-theme:/app/themes/samsesh
    ports:
      - "8080:80"
    environment:
      - MATRIX_THEMES=${MATRIX_THEMES:-light,dark}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      synapse:
        condition: service_started
    networks:
      - matrix-network

  synapse-admin:
    image: awesometechnologies/synapse-admin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - REACT_APP_SERVER=http://synapse:8008
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      synapse:
        condition: service_started
    networks:
      - matrix-network

  lk-jwt-service:
    image: ghcr.io/element-hq/lk-jwt-service:latest
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      # For Docker-internal communication (default for local deployments)
      - LIVEKIT_URL=ws://livekit:7880
      # For production with SSL/TLS and reverse proxy, change to:
      # - LIVEKIT_URL=wss://matrixrtc.yourdomain.com
      - LIVEKIT_KEY=${LIVEKIT_KEY:-devkey}
      - LIVEKIT_SECRET=${LIVEKIT_SECRET:-secret}
      # Restrict call creation to users from specific homeservers (comma-separated)
      - LIVEKIT_FULL_ACCESS_HOMESERVERS=${SYNAPSE_SERVER_NAME:-localhost}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      synapse:
        condition: service_started
      livekit:
        condition: service_started
    networks:
      - matrix-network

  element-call:
    image: ghcr.io/element-hq/element-call:latest
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - ./element-call-config.json:/app/config.json
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      synapse:
        condition: service_started
      lk-jwt-service:
        condition: service_started
    networks:
      - matrix-network

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      # WebRTC port range for media traffic
      - "${WEBRTC_PORT_START:-50000}-${WEBRTC_PORT_END:-60000}:${WEBRTC_PORT_START:-50000}-${WEBRTC_PORT_END:-60000}/udp"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7880/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - matrix-network

  # Jitsi Meet for group video conferencing (alternative to Element Call)
  jitsi-web:
    image: jitsi/web:stable
    restart: unless-stopped
    ports:
      - "${JITSI_HTTP_PORT:-8443}:80"
      - "${JITSI_HTTPS_PORT:-8444}:443"
    volumes:
      - ./jitsi/web:/config:Z
      - ./jitsi/web/letsencrypt:/etc/letsencrypt:Z
      - ./jitsi/transcripts:/usr/share/jitsi-meet/transcripts:Z
    environment:
      - ENABLE_AUTH=${JITSI_ENABLE_AUTH:-0}
      - ENABLE_GUESTS=${JITSI_ENABLE_GUESTS:-1}
      - ENABLE_LETSENCRYPT=${JITSI_ENABLE_LETSENCRYPT:-0}
      - ENABLE_HTTP_REDIRECT=${JITSI_ENABLE_HTTP_REDIRECT:-1}
      - ENABLE_TRANSCRIPTIONS=${JITSI_ENABLE_TRANSCRIPTIONS:-0}
      - DISABLE_HTTPS=${JITSI_DISABLE_HTTPS:-1}
      - JICOFO_COMPONENT_SECRET=${JICOFO_COMPONENT_SECRET}
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - JIGASI_XMPP_USER=jigasi
      - JIGASI_XMPP_PASSWORD=${JIGASI_XMPP_PASSWORD}
      - JIBRI_RECORDER_USER=recorder
      - JIBRI_RECORDER_PASSWORD=${JIBRI_RECORDER_PASSWORD}
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD=${JIBRI_XMPP_PASSWORD}
      - ENABLE_RECORDING=${JITSI_ENABLE_RECORDING:-0}
      - TZ=${TZ:-UTC}
      - PUBLIC_URL=${JITSI_PUBLIC_URL:-https://meet.jitsi}
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_BOSH_URL_BASE=http://jitsi-prosody:5280
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
    depends_on:
      - jitsi-prosody
      - jitsi-jicofo
      - jitsi-jvb
    networks:
      - matrix-network

  jitsi-prosody:
    image: jitsi/prosody:stable
    restart: unless-stopped
    expose:
      - '5222'
      - '5347'
      - '5280'
    volumes:
      - ./jitsi/prosody/config:/config:Z
      - ./jitsi/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
    environment:
      - AUTH_TYPE=${JITSI_AUTH_TYPE:-internal}
      - ENABLE_AUTH=${JITSI_ENABLE_AUTH:-0}
      - ENABLE_GUESTS=${JITSI_ENABLE_GUESTS:-1}
      - GLOBAL_MODULES=
      - GLOBAL_CONFIG=
      - LDAP_URL=
      - LDAP_BASE=
      - LDAP_BINDDN=
      - LDAP_BINDPW=
      - LDAP_FILTER=
      - LDAP_AUTH_METHOD=bind
      - LDAP_VERSION=3
      - LDAP_USE_TLS=1
      - LDAP_TLS_CIPHERS=
      - LDAP_TLS_CHECK_PEER=1
      - LDAP_TLS_CACERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - LDAP_TLS_CACERT_DIR=/etc/ssl/certs
      - LDAP_START_TLS=0
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_GUEST_DOMAIN=guest.meet.jitsi
      - XMPP_MUC_DOMAIN=muc.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_MODULES=
      - XMPP_MUC_MODULES=
      - XMPP_INTERNAL_MUC_MODULES=
      - XMPP_RECORDER_DOMAIN=recorder.meet.jitsi
      - JICOFO_COMPONENT_SECRET=${JICOFO_COMPONENT_SECRET}
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - JIGASI_XMPP_USER=jigasi
      - JIGASI_XMPP_PASSWORD=${JIGASI_XMPP_PASSWORD}
      - JIBRI_XMPP_USER=jibri
      - JIBRI_XMPP_PASSWORD=${JIBRI_XMPP_PASSWORD}
      - JIBRI_RECORDER_USER=recorder
      - JIBRI_RECORDER_PASSWORD=${JIBRI_RECORDER_PASSWORD}
      - JWT_APP_ID=
      - JWT_APP_SECRET=
      - JWT_ACCEPTED_ISSUERS=
      - JWT_ACCEPTED_AUDIENCES=
      - JWT_ASAP_KEYSERVER=
      - JWT_ALLOW_EMPTY=
      - JWT_AUTH_TYPE=
      - JWT_TOKEN_AUTH_MODULE=
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}
    networks:
      - matrix-network

  jitsi-jicofo:
    image: jitsi/jicofo:stable
    restart: unless-stopped
    volumes:
      - ./jitsi/jicofo:/config:Z
    environment:
      - AUTH_TYPE=${JITSI_AUTH_TYPE:-internal}
      - ENABLE_AUTH=${JITSI_ENABLE_AUTH:-0}
      - XMPP_DOMAIN=meet.jitsi
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JICOFO_COMPONENT_SECRET=${JICOFO_COMPONENT_SECRET}
      - JICOFO_AUTH_USER=focus
      - JICOFO_AUTH_PASSWORD=${JICOFO_AUTH_PASSWORD}
      - JICOFO_RESERVATION_REST_BASE_URL=
      - JVB_BREWERY_MUC=jvbbrewery
      - JIGASI_BREWERY_MUC=jigasibrewery
      - JIGASI_SIP_URI=
      - JIBRI_BREWERY_MUC=jibribrewery
      - JIBRI_PENDING_TIMEOUT=90
      - TZ=${TZ:-UTC}
    depends_on:
      - jitsi-prosody
    networks:
      - matrix-network

  jitsi-jvb:
    image: jitsi/jvb:stable
    restart: unless-stopped
    ports:
      - "${JVB_PORT:-10000}:10000/udp"
      - "${JVB_TCP_PORT:-4443}:4443"
    volumes:
      - ./jitsi/jvb:/config:Z
    environment:
      - DOCKER_HOST_ADDRESS=${JITSI_DOCKER_HOST_ADDRESS}
      - XMPP_AUTH_DOMAIN=auth.meet.jitsi
      - XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.jitsi
      - XMPP_SERVER=jitsi-prosody
      - JVB_AUTH_USER=jvb
      - JVB_AUTH_PASSWORD=${JVB_AUTH_PASSWORD}
      - JVB_BREWERY_MUC=jvbbrewery
      - JVB_PORT=${JVB_PORT:-10000}
      - JVB_TCP_HARVESTER_DISABLED=true
      - JVB_TCP_PORT=${JVB_TCP_PORT:-4443}
      - JVB_STUN_SERVERS=stun.l.google.com:19302,stun1.l.google.com:19302,stun2.l.google.com:19302
      - JVB_ENABLE_APIS=rest,colibri
      - TZ=${TZ:-UTC}
      # Use COTURN for TURN/STUN
      - JVB_OCTO_BIND_ADDRESS=
      - JVB_OCTO_PUBLIC_ADDRESS=
      - JVB_OCTO_BIND_PORT=
      - JVB_OCTO_REGION=
    depends_on:
      - jitsi-prosody
    networks:
      - matrix-network

  # Sygnal push notification gateway
  sygnal:
    image: matrixdotorg/sygnal:latest
    container_name: sygnal
    restart: unless-stopped
    ports:
      - "${SYGNAL_PORT:-127.0.0.1:5000}:5000"
    volumes:
      - ./sygnal.yaml:/etc/sygnal/sygnal.yaml:ro
      - ./sygnal.yaml:/sygnal.yaml:ro
    command:
      - python
      - -m
      - sygnal.sygnal
      - -c
      - /etc/sygnal/sygnal.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - matrix-network

networks:
  matrix-network:
    name: matrix-network
    driver: bridge
